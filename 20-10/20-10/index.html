<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bin gửi mẹ Dung - Chúc Mừng 20/10</title>
  <meta name="description"
    content="Trang web chúc mừng ngày Phụ nữ Việt Nam 20/10 dành riêng cho Mẹ yêu dấu với bó hoa rực rỡ và những lời chúc ấm áp.">

  <!-- Favicon -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💐</text></svg>">

  <!-- Google Fonts for Vietnamese Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@500;700&family=Nunito:ital,wght@0,300;0,400;0,600;1,300&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Canvas for falling petals & magical light dust -->
  <canvas id="ambient-canvas"></canvas>

  <!-- Decorative Corner Accents -->
  <div class="corner-ornament top-left"></div>
  <div class="corner-ornament top-right"></div>

  <!-- Main Container -->
  <main class="main-wrapper">
    <!-- Header: Date & Soft Title -->
    <header class="header-section">
      <div class="tag-date">
        <span class="sparkle-icon">✨</span>
        <span>20 Tháng 10 - Ngày Phụ Nữ Việt Nam</span>
        <span class="sparkle-icon">✨</span>
      </div>
    </header>

    <!-- Flower Bouquet Showcase Section -->
    <section class="flower-stage-container" aria-label="Bó hoa xinh đẹp dành tặng Mẹ">
      <div class="glow-backdrop"></div>

      <div class="flower-wrapper" id="flower-wrapper">
        <div class="sparkle-ring" aria-hidden="true">
          <span class="sp sp1">✨</span>
          <span class="sp sp2">🌸</span>
          <span class="sp sp3">✨</span>
          <span class="sp sp4">💫</span>
          <span class="sp sp5">🌸</span>
          <span class="sp sp6">✨</span>
          <span class="sp sp7">💫</span>
          <span class="sp sp8">🌸</span>
        </div>

        <div class="bouquet-photo-frame">
          <img id="bouquet-img" src="bouquet1.png" alt="Bó hoa màu hồng gửi tặng Mẹ yêu dấu" class="bouquet-photo" />
          <div class="photo-glow-overlay" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <!-- Wish / Letter Section (Lời Chúc Ở Dưới Cùng - Ấm Áp & Tự Nhiên) -->
    <section class="wishes-section" id="wishes-section" aria-label="Lời chúc yêu thương gửi Mẹ">
      <div class="letter-card" id="letter-card">

        <!-- Card Decorative Seal -->
        <div class="card-seal">
          <div class="seal-inner">
            <span class="seal-icon">❤️</span>
          </div>
        </div>

        <div class="letter-inner-content">
          <div class="letter-header">
            <span class="letter-recipient-title">Gửi Mẹ yêu,</span>
            <div class="letter-divider">
              <span class="flower-symbol">🌸</span>
            </div>
          </div>

          <!-- The Sincere, Natural Message (Không sến súa, ấm áp chân thành) -->
          <div class="letter-body" id="letter-text-container">
            <p class="greeting-paragraph highlight-line">
              Nhân ngày 20/10, chúc mẹ Dung lúc nào cũng vui vẻ và hạnh phúc.
            </p>
            <p class="greeting-paragraph">
              Con không kịp mua bông tặng mẹ rồi nên làm cái này tặng mẹ nè kk.
            </p>
            <p class="greeting-signature">
              <span>Love,</span>
              <strong class="signature-name" id="child-signature">Bin</strong>
            </p>
          </div>

        </div>

      </div>
    </section>

    <!-- Footer Note -->
    <footer class="page-footer">
      <p class="footer-blessing">🌸 Chúc mừng Ngày Phụ Nữ Việt Nam 20/10 🌸</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>

</html>
